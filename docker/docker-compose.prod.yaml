            HASURA_GRAPHQL_EVENTS_HTTP_POOL_SIZE: "100"
            HASURA_GRAPHQL_INFER_FUNCTION_PERMISSIONS: "true"
            HASURA_GRAPHQL_JWT_SECRET: '{"key":"-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAsAOBDSfLCpprw51KDyjr\nZRXXuaiP/u+XB+4i2o285f5oSW4EuUucD3N8xgcs/6CvfIdj/rmHVq6IcWHs1+gt\nLMC/1w4UcA66ZWoa5QQ7EH9GB+c4g9IaFQ74rtpASGgSi/TwVbOgdDoYbN4++62S\n3fwEe+eUWba/71IsFf+PGoU97k5TgeJ4qzVlHc+MJ3sfNHQlZ4fJ78s1fhJZ0WHp\nbkn+gRrJ+c27JeBB15CQaOUi+4wCbj2sYg+C61BN1o7KA3r0fXPJzvcnOjB7g8af\n2jLAMXjDmr79fQuko+uhm/p5Egw5yNzKSIseMoVJ2VcH2gEGEms7ut9Y34ipEq5Y\nVQIDAQAB\n-----END PUBLIC KEY-----\n","type":"RS256"}'
