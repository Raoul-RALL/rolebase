                    - functions-service
        restart: always
        volumes:
            - type: bind
              source: ..
              target: /opt/project
              read_only: false
            - type: volume
              source: main-root_node_modules
              target: /opt/project/node_modules
              read_only: false
            - type: volume
              source: main-functions_node_modules
              target: /opt/project/functions/node_modules
              read_only: false
    graphql:
        image: nhost/graphql-engine:v2.48.10-ce
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            BACKEND_URL: http://host.docker.internal:8888
            GRAPHITE_WEBHOOK_SECRET: ""
            HASURA_GRAPHQL_ADMIN_INTERNAL_ERRORS: "true"
