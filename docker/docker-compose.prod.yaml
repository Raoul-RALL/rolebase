name: rolebase
services:
    auth:
        image: nhost/auth:0.50.0
        depends_on:
            graphql:
                condition: service_healthy
            postgres:
                condition: service_healthy
        environment:
            AUTH_ACCESS_CONTROL_ALLOWED_EMAIL_DOMAINS: ""
            AUTH_ACCESS_CONTROL_ALLOWED_EMAILS: ""
            AUTH_ACCESS_CONTROL_ALLOWED_REDIRECT_URLS: http://localhost:3032
            AUTH_ACCESS_CONTROL_BLOCKED_EMAIL_DOMAINS: ""
            AUTH_ACCESS_CONTROL_BLOCKED_EMAILS: ""
            AUTH_ACCESS_TOKEN_EXPIRES_IN: "900"
            AUTH_ANONYMOUS_USERS_ENABLED: "false"
            AUTH_API_PREFIX: /v1
            AUTH_CLIENT_URL: https://rolebase.nafnafnafnaf0.synology.me:3032
            AUTH_CONCEAL_ERRORS: "false"
            AUTH_DISABLE_AUTO_SIGNUP: "false"
            AUTH_DISABLE_NEW_USERS: "false"
            AUTH_DISABLE_SIGNUP: "false"
            AUTH_EMAIL_PASSWORDLESS_ENABLED: "true"
            AUTH_EMAIL_SIGNIN_EMAIL_VERIFIED_REQUIRED: "false"
            AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY}
            AUTH_GRAVATAR_ENABLED: "false"
            AUTH_HOST: 0.0.0.0
            AUTH_JWT_CUSTOM_CLAIMS: '{}'
            AUTH_JWT_CUSTOM_CLAIMS_DEFAULTS: '{}'
            AUTH_LOCALE_ALLOWED_LOCALES: en,fr
            AUTH_LOCALE_DEFAULT: en
            AUTH_MFA_ENABLED: "false"
            AUTH_MFA_TOTP_ISSUER: nhost
            AUTH_OTP_EMAIL_ENABLED: "true"
            AUTH_PASSWORD_HIBP_ENABLED: "false"
            AUTH_PASSWORD_MIN_LENGTH: "8"
            AUTH_PORT: "4000"
            AUTH_RATE_LIMIT_BRUTE_FORCE_BURST: "10"
            AUTH_RATE_LIMIT_BRUTE_FORCE_INTERVAL: 5m
            AUTH_RATE_LIMIT_EMAIL_BURST: "10"
            AUTH_RATE_LIMIT_EMAIL_INTERVAL: 1h
            AUTH_RATE_LIMIT_EMAIL_IS_GLOBAL: "true"
            AUTH_RATE_LIMIT_ENABLE: "true"
            AUTH_RATE_LIMIT_GLOBAL_BURST: "100"
            AUTH_RATE_LIMIT_GLOBAL_INTERVAL: 1m
            AUTH_RATE_LIMIT_OAUTH2_SERVER_BURST: "100"
            AUTH_RATE_LIMIT_OAUTH2_SERVER_INTERVAL: 5m
            AUTH_RATE_LIMIT_SIGNUPS_BURST: "10"
            AUTH_RATE_LIMIT_SIGNUPS_INTERVAL: 5m
            AUTH_RATE_LIMIT_SMS_BURST: "10"
            AUTH_RATE_LIMIT_SMS_INTERVAL: 1h
            AUTH_REFRESH_TOKEN_EXPIRES_IN: "2592000"
            AUTH_REQUIRE_ELEVATED_CLAIM: disabled
            AUTH_SERVER_URL: https://rolebase-auth.nafnafnafnaf0.synology.me/v1
            AUTH_SMTP_AUTH_METHOD: LOGIN
            AUTH_SMTP_HOST: smtp.free.fr
            AUTH_SMTP_PASS: ${SMTP_PASS}
            AUTH_SMTP_PORT: "465"
            AUTH_SMTP_SECURE: "true"
            AUTH_SMTP_SENDER: raoul.rall.mobile@free.fr
            AUTH_SMTP_USER: raoul.rall.mobile@free.fr
            AUTH_TURNSTILE_SECRET: ""
            AUTH_USER_DEFAULT_ALLOWED_ROLES: user,me
            AUTH_USER_DEFAULT_ROLE: user
            BACKEND_URL: http://host.docker.internal:8888
            HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
            HASURA_GRAPHQL_DATABASE_URL: postgres://nhost_hasura@postgres:5432/local
            HASURA_GRAPHQL_GRAPHQL_URL: http://graphql:8080/v1/graphql
            HASURA_GRAPHQL_JWT_SECRET: '${AUTH_JWT_SECRET_WITH_SIGNING_KEY}'
            POSTGRES_MIGRATIONS_CONNECTION: postgres://nhost_auth_admin@postgres:5432/local
            WEBAPP_URL: https://rolebase.nafnafnafnaf0.synology.me:3032
        extra_hosts:
            - host.docker.internal:host-gateway
        healthcheck:
            test:
                - CMD
                - wget
                - --spider
                - -S
                - http://localhost:4000/healthz
            timeout: 60s
            interval: 5s
            start_period: 60s
        labels:
            traefik.enable: "true"
            traefik.http.routers.auth.entrypoints: web
            traefik.http.routers.auth.rule: (HostRegexp(`^.+\.auth\.local\.nhost\.run$`) || Host(`local.auth.nhost.run`))
            traefik.http.routers.auth.service: auth
            traefik.http.routers.auth.tls: "true"
            traefik.http.routers.auth-public.entrypoints: websynology
            traefik.http.routers.auth-public.rule: Host(`rolebase-auth.nafnafnafnaf0.synology.me`)
            traefik.http.routers.auth-public.service: auth
            traefik.http.services.auth.loadbalancer.server.port: "4000"
        networks:
            default:
                aliases:
                    - hasura-auth-service
        restart: always
        volumes:
            - type: bind
              source: ../nhost/emails
              target: /app/email-templates
              read_only: false
    configserver:
        image: nhost/cli:1.51.1
        command:
            - configserver
            - --enable-playground
            - --debug
        environment:
            DOCKER_COMPOSE_PROJECT: rolebase
            DOCKER_HOST: unix:///var/run/docker.sock
            NHOST_APP_ID: e148343e-5e5f-4b2d-bf85-34296512a064
        extra_hosts: []
        labels:
            traefik.enable: "true"
            traefik.http.routers.configserver.entrypoints: web
            traefik.http.routers.configserver.rule: (HostRegexp(`^.+\.dashboard\.local\.nhost\.run$`) || Host(`local.dashboard.nhost.run`))&& PathPrefix(`/v1/configserver`)
            traefik.http.routers.configserver.service: configserver
            traefik.http.routers.configserver.tls: "true"
            traefik.http.routers.logs.entrypoints: web
            traefik.http.routers.logs.rule: (HostRegexp(`^.+\.dashboard\.local\.nhost\.run$`) || Host(`local.dashboard.nhost.run`))&& PathPrefix(`/v1/logs`)
            traefik.http.routers.logs.service: logs
            traefik.http.routers.logs.tls: "true"
            traefik.http.services.configserver.loadbalancer.server.port: "8088"
            traefik.http.services.logs.loadbalancer.server.port: "8088"
        restart: always
        volumes:
            - type: bind
              source: ../nhost
              target: /tmp/root/nhost
              read_only: false
            - type: bind
              source: ..
              target: /tmp/root
              read_only: false
            - type: bind
              source: /var/run/docker.sock
              target: /var/run/docker.sock
              read_only: true
              bind:
                selinux: z
    console:
        image: nhost/graphql-engine:v2.48.10-ce.cli-migrations-v3
        depends_on:
            graphql:
                condition: service_healthy
        command:
            - bash
            - -c
            - |4-
                              hasura-cli \
                                  console \
                                  --no-browser \
                                  --endpoint http://graphql:8080 \
                                  --address 0.0.0.0 \
                                  --console-port 9695 \
                                  --api-port 443 \
                                  --api-host https://local.hasura.local.nhost.run \
                                  --console-hge-endpoint https://local.hasura.local.nhost.run
        environment:
            BACKEND_URL: http://host.docker.internal:8888
            GRAPHITE_WEBHOOK_SECRET: ""
            HASURA_GRAPHQL_ADMIN_INTERNAL_ERRORS: "true"
            HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
            HASURA_GRAPHQL_CONSOLE_ASSETS_DIR: /srv/console-assets
            HASURA_GRAPHQL_CORS_DOMAIN: '*'
            HASURA_GRAPHQL_DATABASE_URL: postgres://nhost_hasura@postgres:5432/local
            HASURA_GRAPHQL_DEV_MODE: "true"
            HASURA_GRAPHQL_DISABLE_CORS: "false"
            HASURA_GRAPHQL_ENABLE_ALLOWLIST: "false"
            HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
            HASURA_GRAPHQL_ENABLE_REMOTE_SCHEMA_PERMISSIONS: "false"
            HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
            HASURA_GRAPHQL_ENABLED_APIS: metadata,graphql,pgdump,config
            HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log
            HASURA_GRAPHQL_EVENTS_HTTP_POOL_SIZE: "100"
            HASURA_GRAPHQL_INFER_FUNCTION_PERMISSIONS: "true"
            HASURA_GRAPHQL_JWT_SECRET: '{"key":"-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAsAOBDSfLCpprw51KDyjr\nZRXXuaiP/u+XB+4i2o285f5oSW4EuUucD3N8xgcs/6CvfIdj/rmHVq6IcWHs1+gt\nLMC/1w4UcA66ZWoa5QQ7EH9GB+c4g9IaFQ74rtpASGgSi/TwVbOgdDoYbN4++62S\n3fwEe+eUWba/71IsFf+PGoU97k5TgeJ4qzVlHc+MJ3sfNHQlZ4fJ78s1fhJZ0WHp\nbkn+gRrJ+c27JeBB15CQaOUi+4wCbj2sYg+C61BN1o7KA3r0fXPJzvcnOjB7g8af\n2jLAMXjDmr79fQuko+uhm/p5Egw5yNzKSIseMoVJ2VcH2gEGEms7ut9Y34ipEq5Y\nVQIDAQAB\n-----END PUBLIC KEY-----\n","type":"RS256"}'
            HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_BATCH_SIZE: "100"
            HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_INTERVAL: "1000"
            HASURA_GRAPHQL_LOG_LEVEL: warn
            HASURA_GRAPHQL_PG_CONNECTIONS: "50"
            HASURA_GRAPHQL_PG_TIMEOUT: "180"
            HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "false"
            HASURA_GRAPHQL_TX_ISOLATION: read-committed
            HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
            HASURA_GRAPHQL_USE_PREPARED_STATEMENTS: "true"
            HASURA_GRAPHQL_WS_READ_COOKIE: "false"
