    mailhog:
        image: nhost/mailhog:v1.0.1
        environment:
            SMTP_HOST: mailhog
            SMTP_PASS: password
            SMTP_PORT: "1025"
            SMTP_SECURE: "false"
            SMTP_SENDER: auth@example.com
            SMTP_USER: user
        extra_hosts:
            - host.docker.internal:host-gateway
        labels:
            traefik.enable: "true"
            traefik.http.routers.mailhog.entrypoints: web
            traefik.http.routers.mailhog.rule: (HostRegexp(`^.+\.mailhog\.local\.nhost\.run$`) || Host(`local.mailhog.nhost.run`))
            traefik.http.routers.mailhog.service: mailhog
            traefik.http.routers.mailhog.tls: "true"
            traefik.http.services.mailhog.loadbalancer.server.port: "8025"
        restart: always
        volumes:
            - type: volume
              source: mailhog_main
              target: /maildir
              read_only: false
    minio:
        image: nhost/minio:RELEASE.2025-02-28T09-55-16Z
        entrypoint:
            - /bin/sh
        command:
            - -c
            - mkdir -p /data/nhost && /usr/bin/minio server --address :9000 /data
        environment:
            MINIO_ROOT_PASSWORD: minioaccesskey123123
            MINIO_ROOT_USER: minioaccesskey123123
        extra_hosts:
            - host.docker.internal:host-gateway
        restart: always
        volumes:
            - type: volume
              source: minio_main
              target: /data
    postgres:
        image: nhost/postgres:14.20-20251217-1
        command:
            - postgres
            - -c
            - config_file=/etc/postgresql.conf
            - -c
            - hba_file=/etc/pg_hba_local.conf
        environment:
            PGDATA: /var/lib/postgresql/data/pgdata
            POSTGRES_DB: local
            POSTGRES_DEV_INSECURE: "true"
            POSTGRES_PASSWORD: postgres
            POSTGRES_USER: postgres
        extra_hosts:
            - host.docker.internal:host-gateway
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U postgres -d postgres -q
            timeout: 60s
            interval: 5s
            start_period: 60s
        networks:
            default:
                aliases:
                    - postgres-service
        ports:
            - mode: ingress
              target: 5432
              published: "5433"
              protocol: tcp
        restart: always
        volumes:
            - type: volume
              source: pgdata_main
              target: /var/lib/postgresql/data/pgdata
              read_only: false
            - type: bind
              source: ../.nhost/data/db/pg_hba_local.conf
              target: /etc/pg_hba_local.conf
              read_only: false
    storage:
        image: nhost/storage:0.13.0
        depends_on:
            graphql:
                condition: service_healthy
            minio:
                condition: service_started
            postgres:
                condition: service_healthy
        command:
            - serve
        environment:
            BIND: :5000
            HASURA_ENDPOINT: http://graphql:8080/v1
            HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
            HASURA_METADATA: "1"
            POSTGRES_MIGRATIONS: "1"
            POSTGRES_MIGRATIONS_SOURCE: postgres://nhost_storage_admin@postgres:5432/local?sslmode=disable
            PUBLIC_URL: https://local.storage.local.nhost.run
            S3_ACCESS_KEY: minioaccesskey123123
            S3_BUCKET: nhost
            S3_ENDPOINT: http://minio:9000
            S3_REGION: ""
            S3_ROOT_FOLDER: ""
            S3_SECRET_KEY: minioaccesskey123123
        extra_hosts:
            - host.docker.internal:host-gateway
        labels:
            traefik.enable: "true"
            traefik.http.routers.storage.entrypoints: web
            traefik.http.routers.storage.rule: (HostRegexp(`^.+\.storage\.local\.nhost\.run$`) || Host(`local.storage.nhost.run`))&& PathPrefix(`/v1`)
            traefik.http.routers.storage.service: storage
            traefik.http.routers.storage.tls: "true"
            traefik.http.routers.storage-public.entrypoints: websynology
            traefik.http.routers.storage-public.rule: Host(`rolebase-storage.nafnafnafnaf0.synology.me`)&& PathPrefix(`/v1`)
            traefik.http.routers.storage-public.service: storage
            traefik.http.services.storage.loadbalancer.server.port: "5000"
        networks:
            default:
                aliases:
                    - hasura-storage-service
        restart: always
    traefik:
        image: traefik:v3.6
        command:
            - --api.insecure=true
            - --providers.docker=true
            - --providers.docker.endpoint=unix:///var/run/docker.sock
            - --providers.file.directory=/opt/traefik
            - --providers.file.watch=true
            - --providers.docker.exposedbydefault=false
            - --providers.docker.constraints=Label(`com.docker.compose.project`,`rolebase`)
            - --entrypoints.web.address=:443
            - --entrypoints.websynology.address=:1337
        extra_hosts:
            - host.docker.internal:host-gateway
        networks:
            default:
                aliases:
                    - local.auth.local.nhost.run
                    - local.db.local.nhost.run
                    - local.functions.local.nhost.run
                    - local.graphql.local.nhost.run
                    - local.hasura.local.nhost.run
                    - local.storage.local.nhost.run
                    - local.dashboard.local.nhost.run
                    - local.mailhog.local.nhost.run
                    - local.auth.nhost.run
                    - local.db.nhost.run
                    - local.functions.nhost.run
                    - local.graphql.nhost.run
                    - local.hasura.nhost.run
                    - local.storage.nhost.run
                    - local.dashboard.nhost.run
                    - local.mailhog.nhost.run
        ports:
            - mode: ingress
              target: 443
              published: "443"
              protocol: tcp
            - mode: ingress
              target: 1337
              published: "1337"
              protocol: tcp
        restart: always
        volumes:
            - type: bind
              source: ../.nhost/traefik
              target: /opt/traefik
              read_only: true
            - type: bind
              source: /var/run/docker.sock
              target: /var/run/docker.sock
              read_only: true
              bind:
                selinux: z
